---
deployment:
  tasks:
    # Web root for cPanel user "triangl1" (primary domain trianglecountryclub.com).
    # If trianglecountryclub.com is an addon/sub-domain instead, change this to
    # its document root (e.g. /home/triangl1/trianglecountryclub.com).
    - export DEPLOYPATH=/home/triangl1/public_html
    - /bin/mkdir -p "$DEPLOYPATH"
    # Copy the site (visible files + dirs). mail-config.php is git-ignored,
    # so the server's filled-in copy (with passwords) is never overwritten.
    - /bin/cp -R * "$DEPLOYPATH"
    # Hidden files are not matched by * — copy .htaccess explicitly.
    - /bin/cp -f .htaccess "$DEPLOYPATH"
