---
deployment:
  tasks:
    # EDIT THIS PATH: set it to your account's web root.
    #   Primary domain      -> /home/CPANEL_USERNAME/public_html
    #   Addon/sub-domain    -> /home/CPANEL_USERNAME/trianglecountryclub.com
    - export DEPLOYPATH=/home/CPANEL_USERNAME/public_html
    - /bin/mkdir -p "$DEPLOYPATH"
    # Copy the site (visible files + dirs). mail-config.php is git-ignored,
    # so the server's filled-in copy (with passwords) is never overwritten.
    - /bin/cp -R * "$DEPLOYPATH"
    # Hidden files are not matched by * — copy .htaccess explicitly.
    - /bin/cp -f .htaccess "$DEPLOYPATH"
